<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Password — E-Ink AI</title>
  <link rel="stylesheet" href="/static/style.css">
  <style>
    .gate { min-height: 100vh; display: grid; place-items: center; padding: 2rem;
            background: #0a0b10; color: #eef0f6;
            font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .gate form { width: 100%; max-width: 380px; display: flex; flex-direction: column; gap: 1rem; }
    .gate .mark { font-weight: 800; letter-spacing: 0.04em; font-size: 1.1rem; }
    .gate p { margin: 0; color: #9aa3bd; line-height: 1.55; font-size: 0.9rem; }
    .gate .err { color: #e5463c; font-size: 0.85rem; }
    .gate input { padding: 0.75rem 0.9rem; border: 1px solid #2a2e3a; border-radius: 0.65rem;
                  background: #14151b; color: #eef0f6; font-size: 1rem; }
    .gate input:focus { outline: none; border-color: #c8d0e8; }
    .gate button { padding: 0.75rem; border: 0; border-radius: 0.65rem; background: #c8d0e8;
                   color: #0a0b10; font-weight: 700; font-size: 0.95rem; cursor: pointer; }
    .gate button:hover { background: #dfe5f2; }
  </style>
</head>
<body>
  <main class="gate">
    <form method="post">
      <div class="mark">E-INK · AI</div>
      <p>
        This image generator is password-protected to keep people from abusing my
        generative image credits. Enter the password to continue.
      </p>
      {% if error %}<p class="err">{{ error }}</p>{% endif %}
      <input type="password" name="password" placeholder="Password" autofocus autocomplete="current-password">
      <button type="submit">Enter</button>
    </form>
  </main>
</body>
</html>

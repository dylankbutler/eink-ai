<!DOCTYPE html>
<html lang="en">
<head>

  <title>{% block title %}E-Ink AI{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <a class="brand" href="/">E-INK<span>·</span>AI</a>
    <nav>
      <a href="/" class="{% block nav_chat %}{% endblock %}">Chat</a>

    {% block content %}{% endblock %}

  {% block scripts %}{% endblock %}

</html>

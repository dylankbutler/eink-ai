# Copy to config.yaml and fill in your keys. config.yaml is git-ignored.
# Secrets can also be supplied via env vars (ANTHROPIC_API_KEY, REPLICATE_API_TOKEN),
# which take precedence over values here.

llm:
  anthropic_api_key: ""          # Claude — chat loop + tool calling
  model: claude-sonnet-4-6

image_gen:
  provider: replicate
  replicate_api_token: ""        # https://replicate.com/account/api-tokens
  model: black-forest-labs/flux-schnell

device:
  discovery: mdns                # discovers _einkdisplay._tcp on the LAN
  fallback_host: koipond.local   # used if mDNS is flaky (e.g. phone hotspot)
  fallback_port: 8080

render:
  resolution: [648, 480]
  dither: floyd-steinberg        # or "threshold" for graphic/line-art prompts

auth:
  password: ""                   # gate the web UI (empty => no gate). Or set EINK_PASSWORD.
